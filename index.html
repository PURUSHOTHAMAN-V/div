  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0015; font-family: 'Inter', sans-serif; color: #FFF5E6; }
    #app { width: 100%; height: 100%; position: relative; }

    .section {
      position: absolute; inset: 0;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: none;
    }
    .section.active { opacity: 1; visibility: visible; pointer-events: auto; }

    canvas.three-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; touch-action: none;
    }

    .particles-layer {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
    }

    .ui-layer {
      position: absolute; inset: 0; z-index: 10; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .ui-layer > * { pointer-events: auto; }

    .title-overlay {
      font-family: 'Pacifico', 'Playfair Display', serif;
      font-size: clamp(1.4rem, 5vmin, 3.2rem);
      text-align: center; color: #FFF5E6;
      text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 40px rgba(183,110,121,0.5), 0 0 80px rgba(255,105,180,0.3);
      margin-bottom: clamp(1rem, 4vmin, 2.5rem);
      will-change: transform, opacity;
      line-height: 1.3;
      padding: 0 1rem;
    }

    .glass-btn {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.85rem, 2.5vmin, 1rem);
      padding: clamp(0.7rem, 2vmin, 1rem) clamp(1.4rem, 4vmin, 2.2rem);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px; color: #FFF5E6; cursor: pointer;
      transition: box-shadow 0.3s, background 0.3s, transform 0.2s;
      letter-spacing: 0.03em;
    }
    .glass-btn:hover {
      background: rgba(255,255,255,0.14);
      box-shadow: inset 0 0 20px rgba(255,215,0,0.15), 0 0 30px rgba(183,110,121,0.3);
      transform: scale(1.03);
    }
    .glass-btn:active { transform: scale(0.97); }
    .glass-btn.pulse { animation: heartbeat 0.8s ease-in-out infinite; }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .flash-overlay {
      position: fixed; inset: 0; background: #fff; opacity: 0;
      pointer-events: none; z-index: 100;
    }
    .fade-black {
      position: fixed; inset: 0; background: #000; opacity: 0;
      pointer-events: none; z-index: 99;
    }

    /* Section 2 */
    #section2 .ui-layer { justify-content: flex-end; padding-bottom: clamp(2rem, 8vmin, 4rem); gap: 1rem; }
    #section2 .action-btns { display: flex; flex-direction: column; gap: 0.8rem; align-items: center; }
    .wish-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 5vmin, 2.5rem);
      color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,0.5);
      opacity: 0; pointer-events: none;
    }

    /* Section 3 */
    #section3 { background: #0a0015; }
    #section3 .message-card {
      position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
      width: min(90vw, 520px); max-height: 70vh; overflow-y: auto;
      background: #FFF5E6; border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(183,110,121,0.2);
      padding: clamp(1.5rem, 4vmin, 2.5rem);
      z-index: 5; opacity: 0;
    }
    #section3 .message-card.visible { opacity: 1; }
    #section3 .message-line {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.95rem, 2.8vmin, 1.15rem);
      color: #2D0057; line-height: 1.7; margin-bottom: 0.6rem;
      min-height: 1.7em;
    }
    #section3 .cursor-blink::after {
      content: '|'; animation: blink 0.7s step-end infinite; color: #B76E79;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Section 4 */
    #section4 { background: #0A0015; }
    #section4 .gradient-bg {
      position: absolute; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #B76E79, #2D0057, #0A0015);
      background-size: 300% 300%;
      will-change: background-position;
    }
    #section4 .bokeh-layer {
      position: absolute; inset: 0; z-index: 1;
      filter: blur(60px); pointer-events: none;
    }
    #section4 .photo-stage {
      position: absolute; inset: 0; z-index: 3; overflow: hidden;
      perspective: 1200px;
    }
    #section4 .photo-wrap {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      will-change: transform, opacity;
    }
    #section4 .photo-wrap img,
    #section4 .photo-wrap video {
      width: 100%; height: 100%; object-fit: cover;
      will-change: transform, opacity, clip-path;
    }
    #section4 .slide-video {
      display: none; position: absolute; inset: 0;
    }
    #section4 .slide-video.active { display: block; }
    #section4 .photo-wrap img.hidden { display: none; }
    #section4 .color-wash {
      position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(183,110,121,0.4));
      transform: translateX(100%); z-index: 2; pointer-events: none;
    }
    #section4 .film-burn {
      position: absolute; inset: 0; pointer-events: none; z-index: 4; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(255,140,50,0.8) 0%, transparent 70%);
    }
    #section4 .venetian-slat {
      position: absolute; left: 0; right: 0; background-size: cover; background-position: center;
      transform-origin: top center; transform: rotateX(90deg);
      will-change: transform;
    }
    #section4 .vignette {
      position: absolute; inset: 0; z-index: 8; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
    }
    #section4 .slideshow-ui {
      position: absolute; bottom: clamp(1rem, 4vmin, 2rem); left: 50%; transform: translateX(-50%);
      z-index: 12; display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
      pointer-events: none;
    }
    #section4 .photo-counter {
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      padding: 0.4rem 1.2rem; border-radius: 50px;
      font-size: clamp(0.7rem, 2vmin, 0.85rem); color: rgba(255,245,230,0.8);
      border: 1px solid rgba(255,255,255,0.12);
    }
    #section4 .dot-row { display: flex; gap: 6px; }
    #section4 .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.25); transition: background 0.3s, transform 0.3s;
    }
    #section4 .dot.active { background: #FFD700; transform: scale(1.3); }
    #section4 .music-toggle {
      position: absolute; top: clamp(1rem, 3vmin, 1.5rem); right: clamp(1rem, 3vmin, 1.5rem);
      z-index: 12; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #section4 .wave-icon { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
    #section4 .wave-icon span {
      width: 3px; background: #FFD700; border-radius: 2px;
      animation: none; height: 4px;
    }
    #section4 .wave-icon.playing span { animation: wave 0.6s ease-in-out infinite alternate; }
    #section4 .wave-icon.playing span:nth-child(1) { animation-delay: 0s; }
    #section4 .wave-icon.playing span:nth-child(2) { animation-delay: 0.15s; }
    #section4 .wave-icon.playing span:nth-child(3) { animation-delay: 0.3s; }
    #section4 .wave-icon.playing span:nth-child(4) { animation-delay: 0.1s; }
    @keyframes wave { to { height: 16px; } }

    /* Section 5 */
    #section5 .ui-layer { justify-content: flex-end; padding-bottom: clamp(2rem, 6vmin, 3rem); }
    #section5 .finale-subtitle {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1rem, 3vmin, 1.4rem);
      color: rgba(255,245,230,0.85); text-align: center;
      margin-top: clamp(0.5rem, 2vmin, 1rem);
      text-shadow: 0 0 20px rgba(255,105,180,0.4);
      opacity: 0;
    }

    .hidden { display: none !important; }
  </style>
</head>

        <div class="photo-counter" id="photoCounter">Photo 1 of 84</div>
        <div class="dot-row" id="dotRow"></div>

    </section>

    const particleContainers = {};
    async function loadParticles(id, options) {
      const el = document.getElementById(id);

      if (particleContainers[id]) {

        delete particleContainers[id];
      }
      particleContainers[id] = await tsParticles.load({ id, element: el, options });
      return particleContainers[id];

      if (particleContainers[id]) {
        try { particleContainers[id].destroy(); } catch (_) {}
        delete particleContainers[id];
      }

                                                    if (this.muted) return;
                                                    this.trackIndex = (this.trackIndex + 1) % this.tracks.length;
                                                    this.bgm.stop();
                                                    this.bgm.unload();
                                                    this.bgm = new Howl({
                                                      src: [this.tracks[this.trackIndex]],
                                                      loop: false,
                                                      volume: this.volume,
                                                      html5: true,
                                                      onend: () => {
                                                        if (this.muted) return;
                                                        this.trackIndex = (this.trackIndex + 1) % this.tracks.length;
                                                        this.bgm.stop();
                                                        this.bgm.unload();
                                                        // recurse by reusing the existing pattern
                                                      }
                                                    });
                                                    this.bgm.play().catch(() => {});
                                                  }
                                                });
                                                this.bgm.play().catch(() => {});
                                              }
                                            });
                                            this.bgm.play().catch(() => {});
                                          }
                                        });
                                        this.bgm.play().catch(() => {});
                                      }
                                    });
                                    this.bgm.play().catch(() => {});
                                  }
                                });
                                this.bgm.play().catch(() => {});
                              }
                            });
                            this.bgm.play().catch(() => {});
                          }
                        });
                        this.bgm.play().catch(() => {});
                      }
                    });
                    this.bgm.play().catch(() => {});
                  }
                });
                this.bgm.play().catch(() => {});
              }
            });
            this.bgm.play().catch(() => {});
          }
        });
      }

      unlock() {
        if (this.unlocked) return;
        this.unlocked = true;
        this._initTrackIfNeeded();
        if (!this.muted) this.bgm.play();
      }

      toggleMusic() {
        this.unlock();
        this.muted = !this.muted;
        if (this.muted) {
          this.bgm?.pause();
        } else {
          // ensure correct track
          this._initTrackIfNeeded();
          if (!this.bgm.playing()) this.bgm.play();
        }
        return !this.muted;
      }

      playSfx(name) {
        this.unlock();
        // SFX not wired in this version; avoid crashing.
        if (this.sfx && this.sfx[name] && this.sfx[name].play) this.sfx[name].play();
      }
    }
    const audio = new AudioManager();

    function transitionToSection(fromEl, toEl, onMid, onComplete) {
      gsap.set(flashOverlay, { opacity: 0 });
      const tl = gsap.timeline({ onComplete });
      tl.to(fadeBlack, { opacity: 1, duration: 0.4, ease: 'power2.inOut' })
        .call(() => {
          if (fromEl) { fromEl.classList.remove('active'); }
          toEl.classList.add('active');
          if (onMid) onMid();
        })
        .to(fadeBlack, { opacity: 0, duration: 0.8, ease: 'power2.inOut' })
        .fromTo(toEl, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.inOut' }, '-=0.8');
      return tl;
    }

    function disposeObject(obj) {
      obj.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
          else child.material.dispose();
        }
      });
    }

    function makeResizeObserver(canvas, camera, renderer, composer) {
      const ro = new ResizeObserver(() => {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!w || !h) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
        if (composer) composer.setSize(w, h);
      });
      ro.observe(canvas.parentElement || canvas);
      return ro;
    }

    /* ─── BALLOON SHADER ─── */
    const balloonVertexShader = `
      varying vec3 vNormal; varying vec3 vViewPosition;
      void main() {
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        vViewPosition = -mvPos.xyz;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * mvPos;
      }`;
    const balloonFragmentShader = `
      uniform vec3 uColor; uniform vec3 uRimColor;
      varying vec3 vNormal; varying vec3 vViewPosition;
      void main() {
        vec3 viewDir = normalize(vViewPosition);
        float fresnel = pow(1.0 - max(dot(vNormal, viewDir), 0.0), 2.5);
        vec3 col = mix(uColor * 0.85, uRimColor, fresnel * 0.7);
        col += vec3(0.08) * fresnel;
        gl_FragColor = vec4(col, 1.0);
      }`;

    /* ─── FLAME SHADER ─── */
    const flameVertexShader = `
      varying vec2 vUv; varying float vY;
      void main() {
        vUv = uv; vY = position.y;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`;
    const flameFragmentShader = `
      uniform float uTime;
      varying vec2 vUv; varying float vY;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p); vec2 f = fract(p);
        f = f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
      }
      void main() {
        float n = noise(vec2(vUv.x * 4.0 + uTime * 3.0, vUv.y * 6.0 - uTime * 4.0));
        float n2 = noise(vec2(vUv.x * 8.0 - uTime * 2.0, vY * 10.0));
        float turb = n * 0.6 + n2 * 0.4;
        float alpha = smoothstep(0.0, 0.5, vY + 0.3) * (1.0 - smoothstep(0.3, 1.0, vY)) * (0.7 + turb * 0.3);
        vec3 amber = vec3(1.0, 0.6, 0.1);
        vec3 orange = vec3(1.0, 0.35, 0.05);
        vec3 yellow = vec3(1.0, 0.9, 0.2);
        vec3 col = mix(amber, mix(orange, yellow, turb), vY + turb * 0.2);
        gl_FragColor = vec4(col, alpha);
      }`;

    /* ─── SECTION 1: DECORATION ROOM ─── */
    class Section1 {
      constructor() {
        this.canvas = $('#canvas1');
        this.scene = null; this.camera = null; this.renderer = null;
        this.composer = null; this.sceneGroup = null; this.balloons = [];
        this.lights = []; this.bulbLights = []; this.rafId = null;
        this.resizeObs = null; this.initialized = false;
        this.mouse = { x: 0, y: 0 };
        this.titleMesh = null;
        this.parallaxQuick = null;
      }

      init() {
        if (this.initialized) return;
        this.initialized = true;

        const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
        this.scene = new THREE.Scene();
        this.scene.fog = new THREE.FogExp2(0x1a0a15, 0.035);
        this.camera = new THREE.PerspectiveCamera(55, w / h, 0.1, 100);
        this.camera.position.set(0, 1.5, 8);

        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(w, h, false);
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;

        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(new RenderPass(this.scene, this.camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.6, 0.4, 0.85);
        this.composer.addPass(bloom);
        this.bloomPass = bloom;

        this.sceneGroup = new THREE.Group();
        this.scene.add(this.sceneGroup);

        this._buildRoom();
        this._buildStringLights();
        this._buildBunting();
        this._buildBalloons();
        this._loadTitleText();

        const amb = new THREE.AmbientLight(0xffeedd, 0.4);
        const warm = new THREE.DirectionalLight(0xffccaa, 0.8);
        warm.position.set(2, 5, 3);
        this.scene.add(amb, warm);
        this.lights.push(warm);

        this.resizeObs = makeResizeObserver(this.canvas, this.camera, this.renderer, this.composer);
        this._initConfetti();
        this._bindEvents();
        this._animate();

        gsap.to(this.titleMesh?.position || { y: 0 }, {
          y: '+=0.15', duration: 2, yoyo: true, repeat: -1, ease: 'sine.inOut'
        });
      }

      _buildRoom() {
        const canvas2d = document.createElement('canvas');
        canvas2d.width = 512; canvas2d.height = 512;
        const ctx = canvas2d.getContext('2d');
        const grd = ctx.createLinearGradient(0, 0, 0, 512);
        grd.addColorStop(0, '#B76E79'); grd.addColorStop(1, '#D4A054');
        ctx.fillStyle = grd; ctx.fillRect(0, 0, 512, 512);
        const tex = new THREE.CanvasTexture(canvas2d);

        const wall = new THREE.Mesh(
          new THREE.PlaneGeometry(14, 7, 32, 16),
          new THREE.MeshPhongMaterial({ map: tex, side: THREE.DoubleSide })
        );
        wall.position.set(0, 2, -4);
        const pos = wall.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          pos.setZ(i, -Math.abs(x) * 0.08);
        }
        pos.needsUpdate = true;
        wall.geometry.computeVertexNormals();
        this.sceneGroup.add(wall);

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(14, 10),
          new THREE.MeshPhongMaterial({ color: 0x2a1520 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.5;
        this.sceneGroup.add(floor);
      }

      _buildStringLights() {
        const points = [];
        for (let i = 0; i <= 40; i++) {
          const t = i / 40;
          points.push(new THREE.Vector3((t - 0.5) * 12, 4.5 + Math.sin(t * Math.PI * 3) * 0.4, -2.5));
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const tube = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 80, 0.02, 6, false),
          new THREE.MeshBasicMaterial({ color: 0x333333 })
        );
        this.sceneGroup.add(tube);

        const bulbColors = [0xFFD700, 0xFF69B4, 0xFFF5E6, 0xC0A0FF];
        for (let i = 0; i < 18; i++) {
          const t = i / 17;
          const pt = curve.getPoint(t);
          const bulb = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 16, 16),
            new THREE.MeshBasicMaterial({ color: bulbColors[i % 4] })
          );
          bulb.position.copy(pt);
          this.sceneGroup.add(bulb);

          const pl = new THREE.PointLight(bulbColors[i % 4], 0.6, 3);
          pl.position.copy(pt);
          this.sceneGroup.add(pl);
          this.bulbLights.push(pl);

          gsap.to(bulb.position, { y: pt.y + 0.05, duration: 1.5 + Math.random(), yoyo: true, repeat: -1, ease: 'sine.inOut', delay: Math.random() });
        }
      }

      _buildBunting() {
        const colors = ['#B76E79', '#2D0057', '#FFF5E6'];
        for (let i = 0; i < 12; i++) {
          const banner = new THREE.Mesh(
            new THREE.PlaneGeometry(0.7, 0.5),
            new THREE.MeshBasicMaterial({ color: colors[i % 3], side: THREE.DoubleSide })
          );
          const t = (i - 5.5) * 0.9;
          banner.position.set(t, 5.2, -2);
          banner.rotation.z = (i % 2 ? 0.15 : -0.15);
          this.sceneGroup.add(banner);
        }
      }

      _buildBalloons() {
        const colors = [0xFF69B4, 0xC0A0FF, 0xFFD700, 0xFF8C69, 0xB76E79];
        for (let i = 0; i < 18; i++) {
          const group = new THREE.Group();
          const col = colors[i % colors.length];
          const mat = new THREE.ShaderMaterial({
            uniforms: {
              uColor: { value: new THREE.Color(col) },
              uRimColor: { value: new THREE.Color(0xffffff) }
            },
            vertexShader: balloonVertexShader,
            fragmentShader: balloonFragmentShader
          });
          const balloon = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), mat);
          balloon.scale.y = 1.25;
          group.add(balloon);

          const stringCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0, -0.45, 0),
            new THREE.Vector3(0.02, -0.8, 0),
            new THREE.Vector3(-0.02, -1.2, 0)
          ]);
          const string = new THREE.Mesh(
            new THREE.TubeGeometry(stringCurve, 8, 0.008, 4, false),
            new THREE.MeshBasicMaterial({ color: 0x888888 })
          );
          group.add(string);

          group.position.set((Math.random() - 0.5) * 8, Math.random() * 2 + 0.5, (Math.random() - 0.5) * 3 - 1);
          this.sceneGroup.add(group);
          this.balloons.push(group);

          gsap.to(group.position, {
            y: group.position.y + 0.3, duration: 2 + Math.random() * 2,
            yoyo: true, repeat: -1, ease: 'sine.inOut'
          });
          gsap.to(group.rotation, {
            z: 0.08, duration: 1.5 + Math.random(), yoyo: true, repeat: -1, ease: 'sine.inOut'
          });
        }
      }

      _loadTitleText() {
        const loader = new FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.168.0/examples/fonts/gentilis_regular.typeface.json', (font) => {
          const geo = new TextGeometry('A Special Day', {
            font, size: 0.35, height: 0.08, curveSegments: 8
          });
          geo.center();
          const mat = new THREE.MeshPhongMaterial({
            color: 0xFFF5E6, emissive: 0xFFD700, emissiveIntensity: 0.4, shininess: 80
          });
          this.titleMesh = new THREE.Mesh(geo, mat);
          this.titleMesh.position.set(0, 2.8, 0);
          this.sceneGroup.add(this.titleMesh);

          gsap.to(this.titleMesh.position, { y: 2.95, duration: 2.5, yoyo: true, repeat: -1, ease: 'sine.inOut' });
        });
      }

      async _initConfetti() {
        if (!window.tsParticles) return;
        await loadParticles('confetti1', {
          fullScreen: { enable: false },
          particles: {
            number: { value: 80 },
            color: { value: ['#FFD700', '#FF69B4', '#C0A0FF', '#FF8C69'] },
            shape: { type: 'square' },
            size: { value: { min: 4, max: 8 } },
            move: {
              enable: true, speed: { min: 1, max: 3 }, direction: 'bottom',
              gravity: { enable: true, acceleration: 0.3 }, outModes: { default: 'out' }
            },
            rotate: {
              value: { min: 0, max: 360 },
              animation: { enable: true, speed: 20 }
            },
            opacity: { value: { min: 0.5, max: 1 } }
          },
          detectRetina: true
        });
        const el = document.getElementById('confetti1');
        if (el) el.style.perspective = '800px';
      }

      _bindEvents() {
        const onMove = (e) => {
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          this.mouse.x = (cx / window.innerWidth - 0.5) * 2;
          this.mouse.y = (cy / window.innerHeight - 0.5) * 2;
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: true });

        $('#enterBtn').addEventListener('click', () => this._enterCelebration());
        $('#enterBtn').addEventListener('touchend', (e) => { e.preventDefault(); this._enterCelebration(); });
      }

      _enterCelebration() {
        audio.unlock();
        const tl = gsap.timeline();

        this.balloons.forEach((b, i) => {
          tl.to(b.scale, { x: 0, y: 0, z: 0, duration: 0.3, ease: 'back.in(2)' }, i * 0.03);
        });

        this.bulbLights.forEach((l) => tl.to(l, { intensity: 2, duration: 0.5 }, 0));
        tl.to(this.bloomPass, { strength: 1.5, duration: 0.6 }, 0);
        tl.to(this.camera.position, { z: 4, duration: 1.2, ease: 'power2.in' }, 0.2);
        tl.to(flashOverlay, { opacity: 1, duration: 0.25, ease: 'power2.in' }, 0.9)
          .to(flashOverlay, { opacity: 0, duration: 0.35, ease: 'power2.out' }, 1.05);
        tl.call(() => {
          gsap.set(flashOverlay, { opacity: 0 });
          this.dispose();
          transitionToSection($('#section1'), $('#section2'), () => {
            gsap.set(flashOverlay, { opacity: 0 });
            section2.init();
          });
        }, null, 1.2);
      }

      _animate() {
        const loop = () => {
          if (!this.initialized || this.disposed) return;
          this.rafId = requestAnimationFrame(loop);

          if (!this.parallaxQuick) {
            this.parallaxQuick = {
              x: gsap.quickTo(this.sceneGroup.rotation, 'x', { duration: 0.8, ease: 'power2.out' }),
              y: gsap.quickTo(this.sceneGroup.rotation, 'y', { duration: 0.8, ease: 'power2.out' })
            };
          }
          this.parallaxQuick.x(this.mouse.y * 0.087);
          this.parallaxQuick.y(this.mouse.x * 0.087);

          this.composer.render();
        };
        loop();
      }

      dispose() {
        this.disposed = true;
        if (this.rafId) cancelAnimationFrame(this.rafId);
        if (this.resizeObs) this.resizeObs.disconnect();
        disposeObject(this.sceneGroup);
        this.renderer.dispose();
        destroyParticles('confetti1');
        this.initialized = false;
      }
    }

      _buildCake() {

          { r: 1.4, h: 0.6, y: 0.3, color: 0xFFF5E6 },
          { r: 1.0, h: 0.5, y: 0.85, color: 0xFFF0E0 },
          { r: 0.65, h: 0.4, y: 1.3, color: 0xFFF5E6 }
        ];

        tiers.forEach((t, idx) => {
          const tier = new THREE.Mesh(
            new THREE.CylinderGeometry(t.r, t.r, t.h, 32),
            new THREE.MeshPhongMaterial({ color: t.color, shininess: 30 })
          );
          tier.position.y = t.y;
          this.cakeGroup.add(tier);

          const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.CylinderGeometry(t.r, t.r, t.h, 32)),
            new THREE.LineBasicMaterial({ color: 0xB76E79 })
          );
          edges.position.y = t.y;
          this.cakeGroup.add(edges);

          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            const sp = new THREE.Mesh(
              new THREE.SphereGeometry(0.05, 8, 8),
              new THREE.MeshPhongMaterial({ color: 0xB76E79 })
            );
            sp.position.set(Math.cos(a) * t.r, t.y + t.h / 2, Math.sin(a) * t.r);
            this.cakeGroup.add(sp);
          }
        });

        const innerColors = [0x8B4513, 0xFFF5E6, 0xFF69B4];
        this.innerLayers = [];
        innerColors.forEach((c, i) => {
          const disc = new THREE.Mesh(
            new THREE.CylinderGeometry(0.6 - i * 0.05, 0.6 - i * 0.05, 0.08, 32),
            new THREE.MeshBasicMaterial({ color: c, visible: false })
          );
          disc.position.y = 1.1 - i * 0.1;
          disc.name = 'inner';
          this.cakeGroup.add(disc);
          this.innerLayers.push(disc);
        });

        this.topHalf = new THREE.Group();
        this.topHalf.position.y = 1.1;
        const topCap = new THREE.Mesh(
          new THREE.CylinderGeometry(0.65, 0.65, 0.35, 32),
          new THREE.MeshPhongMaterial({ color: 0xFFF5E6 })
        );
        topCap.position.y = 0.2;
        this.topHalf.add(topCap);
        this.cakeGroup.add(this.topHalf);

        const candlePositions = [-0.3, -0.15, 0, 0.15, 0.3];
        candlePositions.forEach((x, i) => {
          const candleGroup = new THREE.Group();
          candleGroup.position.set(x, 1.55, 0);

          const candle = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.035, 0.35, 8),
            new THREE.MeshPhongMaterial({ color: 0xFFF5E6 })
          );
          candleGroup.add(candle);

          const wick = new THREE.Mesh(
            new THREE.CylinderGeometry(0.008, 0.008, 0.06, 6),
            new THREE.MeshBasicMaterial({ color: 0x222222 })
          );
          wick.position.y = 0.2;
          candleGroup.add(wick);
          this.wicks.push(wick);

          const flameMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 } },
            vertexShader: flameVertexShader,
            fragmentShader: flameFragmentShader,
            transparent: true, side: THREE.DoubleSide, depthWrite: false
          });
          this.flameMats.push(flameMat);

          const flame = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.12, 8), flameMat);
          flame.position.y = 0.28;
          candleGroup.add(flame);
          this.flames.push(flame);

          this.candles.push(candleGroup);
          this.cakeGroup.add(candleGroup);
        });

        this.clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
      }

      _bindEvents() {
        $('#blowBtn').addEventListener('click', () => this._blowCandles());
        $('#blowBtn').addEventListener('touchend', (e) => { e.preventDefault(); this._blowCandles(); });
        $('#cutBtn').addEventListener('click', () => this._cutCake());
        $('#cutBtn').addEventListener('touchend', (e) => { e.preventDefault(); this._cutCake(); });
        $('#messageBtn').addEventListener('click', () => this._goToMessage());
        $('#messageBtn').addEventListener('touchend', (e) => { e.preventDefault(); this._goToMessage(); });
      }

      async _blowCandles() {
        if (this.candlesBlown) return;
        this.candlesBlown = true;
        audio.playSfx('blow');

        const tl = gsap.timeline();
        this.flames.forEach((f, i) => {
          tl.to(f.scale, { x: 0, y: 0, z: 0, duration: 0.4, ease: 'power2.in' }, i * 0.1);
          tl.call(() => this._puffAt(f), null, i * 0.1);
        });

        this.wicks.forEach((w) => {
          tl.to(w.material.color, { r: 1, g: 0.2, b: 0.1, duration: 0.2 }, 0.5);
          tl.to(w.material.color, { r: 0.1, g: 0.1, b: 0.1, duration: 0.8 }, 0.9);
        });

        this._spawnSmoke();

        tl.call(() => {
          $('#blowBtn').classList.add('hidden');
          $('#cutBtn').classList.remove('hidden');
        }, null, 1.2);
      }

      _spawnSmoke() {
        const smokeMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uOpacity: { value: 0.6 } },
          vertexShader: `
            varying vec2 vUv;
            void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `
            uniform float uTime; uniform float uOpacity; varying vec2 vUv;
            void main() {
              float a = smoothstep(0.0, 0.3, vUv.y) * (1.0 - smoothstep(0.5, 1.0, vUv.y + uTime * 0.15));
              a *= uOpacity * (0.4 + 0.2 * sin(vUv.x * 10.0 + uTime));
              gl_FragColor = vec4(0.7, 0.7, 0.75, a * 0.5);
            }`,
          transparent: true, side: THREE.DoubleSide, depthWrite: false
        });
        const smoke = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2), smokeMat);
        smoke.position.set(0, 1.8, 0.5);
        this.scene.add(smoke);
        gsap.to(smoke.position, { y: 3.5, duration: 2.5, ease: 'power1.out' });
        gsap.to(smokeMat.uniforms.uOpacity, { value: 0, duration: 2.5, ease: 'power2.in',
          onComplete: () => {
            smoke.geometry.dispose(); smokeMat.dispose(); this.scene.remove(smoke);
            this.smokePlanes = this.smokePlanes.filter(s => s !== smokeMat);
          }
        });
        this.smokePlanes.push(smokeMat);
      }

      async _puffAt(flame) {
        const worldPos = new THREE.Vector3();
        flame.getWorldPosition(worldPos);
        if (!document.getElementById('puffParticles').dataset.loaded) {
          await loadParticles('puffParticles', {
            fullScreen: { enable: false },
            particles: {
              number: { value: 0 },
              color: { value: ['#ffffff', '#cccccc', '#aaaaaa'] },
              size: { value: { min: 1, max: 3 } },
              move: { speed: 2, outModes: { default: 'destroy' } },
              opacity: { value: { min: 0.3, max: 0.8 } },
              life: { duration: { value: 0.5 } }
            },
            emitters: {
              direction: 'top', rate: { quantity: 15, delay: 0.01 },
              size: { width: 10, height: 10 }, life: { count: 1, duration: 0.1 }
            }
          });
          document.getElementById('puffParticles').dataset.loaded = '1';
        }
        playParticles('puffParticles');
      }

      _cutCake() {
        if (this.cakeCut) return;
        this.cakeCut = true;
        audio.playSfx('knife');

        if (!this.knife) {
          this.knife = new THREE.Group();
          const blade = new THREE.Mesh(
            new THREE.BoxGeometry(0.02, 0.6, 0.12),
            new THREE.MeshPhongMaterial({ color: 0xcccccc, shininess: 100 })
          );
          const handle = new THREE.Mesh(
            new THREE.BoxGeometry(0.04, 0.15, 0.06),
            new THREE.MeshPhongMaterial({ color: 0x2D0057 })
          );
          handle.position.y = -0.35;
          this.knife.add(blade, handle);
          this.knife.position.set(2, 4, 1);
          this.scene.add(this.knife);
        }

        const tl = gsap.timeline();
        tl.to(this.knife.position, {
          motionPath: {
            path: [
              { x: 2, y: 4, z: 1 },
              { x: 0.5, y: 2.5, z: 0.5 },
              { x: 0, y: 1.5, z: 0 }
            ],
            curviness: 1.5
          },
          duration: 1.5, ease: 'power2.inOut'
        });
        tl.call(() => {
          audio.playSfx('confetti');
          this.innerLayers.forEach(d => d.visible = true);
          gsap.to(this.topHalf.position, { x: 1.2, duration: 1, ease: 'power2.out' });
          this._cakeConfettiBurst();
        });
        tl.call(() => {
          $('#cutBtn').classList.add('hidden');
          gsap.to('#wishText', { opacity: 1, duration: 0.8 });
          gsap.fromTo('#wishText', { text: '' }, {
            text: 'Make a Wish! ', duration: 1.5, ease: 'none',
            onComplete: () => {
              gsap.delayedCall(3, () => {
                $('#messageBtn').classList.remove('hidden');
              });
            }
          });
        }, null, 1.8);
      }

      async _cakeConfettiBurst() {
        await loadParticles('cakeConfetti', {
          fullScreen: { enable: false },
          particles: {
            number: { value: 0 },
            color: { value: ['#FFD700', '#FF69B4', '#C0A0FF', '#FF8C69'] },
            shape: { type: 'square' },
            size: { value: { min: 3, max: 7 } },
            move: { speed: { min: 3, max: 8 }, outModes: { default: 'destroy' } },
            rotate: { animation: { enable: true, speed: 30 } },
            life: { duration: { value: 2 } }
          },
          emitters: {
            position: { x: 50, y: 40 },
            rate: { quantity: 200, delay: 0.001 },
            size: { width: 0, height: 0 },
            life: { count: 1, duration: 0.05 }
          }
        });
        playParticles('cakeConfetti');
      }

      _goToMessage() {
        this.dispose();
        transitionToSection($('#section2'), $('#section3'), () => section3.init());
      }

      _animate() {
        const loop = () => {
          if (!this.initialized || this.disposed) return;
          this.rafId = requestAnimationFrame(loop);
          this.time += 0.016;
          this.flameMats.forEach(m => { m.uniforms.uTime.value = this.time; });
          this.smokePlanes.forEach(m => { m.uniforms.uTime.value = this.time; });
          this.renderer.render(this.scene, this.camera);
        };
        loop();
      }

      dispose() {
        this.disposed = true;
        if (this.rafId) cancelAnimationFrame(this.rafId);
        if (this.resizeObs) this.resizeObs.disconnect();
        disposeObject(this.cakeGroup);
        if (this.knife) disposeObject(this.knife);
        this.renderer.dispose();
        destroyParticles('puffParticles');
        destroyParticles('cakeConfetti');
        this.initialized = false;
      }
    }

    /* ─── SECTION 3: MESSAGE ─── */
    class Section3 {
      constructor() {
        this.canvas = $('#canvas3');
        this.scene = null; this.camera = null; this.renderer = null;
        this.envelope = null; this.flap = null;
        this.rafId = null; this.resizeObs = null; this.initialized = false;
        this.starField = null;
      }

      init() {
        if (this.initialized) return;
        this.initialized = true;
        this.disposed = false;

        const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x0a0015);
        this.camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 200);
        this.camera.position.z = 5;

        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(w, h, false);

        this._buildStars();
        this._buildEnvelope();

        this.resizeObs = makeResizeObserver(this.canvas, this.camera, this.renderer, null);
        this._animate();
        this._revealMessage();
      }

      _buildStars() {
        const count = 2000;
        const pos = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          pos[i * 3] = (Math.random() - 0.5) * 100;
          pos[i * 3 + 1] = (Math.random() - 0.5) * 100;
          pos[i * 3 + 2] = (Math.random() - 0.5) * 100;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        this.starField = new THREE.Points(geo, new THREE.PointsMaterial({
          color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8
        }));
        this.scene.add(this.starField);
      }

      _buildEnvelope() {
        this.envelope = new THREE.Group();

        const body = new THREE.Mesh(
          new THREE.BoxGeometry(2, 1.2, 0.05),
          new THREE.MeshPhongMaterial({ color: 0xB76E79, emissive: 0x2D0057, emissiveIntensity: 0.2 })
        );
        this.envelope.add(body);

        const flapShape = new THREE.Shape();
        flapShape.moveTo(-1, 0); flapShape.lineTo(0, 0.7); flapShape.lineTo(1, 0); flapShape.lineTo(-1, 0);
        const flapGeo = new THREE.ShapeGeometry(flapShape);
        this.flap = new THREE.Mesh(flapGeo, new THREE.MeshPhongMaterial({
          color: 0xC08090, side: THREE.DoubleSide, emissive: 0xB76E79, emissiveIntensity: 0.15
        }));
        this.flap.position.set(0, 0.6, 0.03);
        this.flap.geometry.translate(0, 0, 0);
        this.flap.rotation.x = 0;
        const flapPivot = new THREE.Group();
        flapPivot.position.set(0, 0.6, 0.03);
        flapPivot.add(this.flap);
        this.flap.position.set(0, 0, 0);
        this.envelope.add(flapPivot);
        this.flapPivot = flapPivot;

        this.envelope.position.set(0, 0.5, 0);
        this.scene.add(this.envelope);

        gsap.to(this.flapPivot.rotation, { x: -Math.PI * 0.85, duration: 1.5, delay: 0.5, ease: 'power2.inOut' });
      }

      async _revealMessage() {
        const container = $('#messageLines');
        container.innerHTML = '';
        MESSAGE_LINES.forEach((line, i) => {
          const div = document.createElement('div');
          div.className = 'message-line';
          div.id = `msgLine${i}`;
          container.appendChild(div);
        });

        gsap.delayedCall(1.8, () => $('#messageCard').classList.add('visible'));

        let delay = 2.2;
        for (let i = 0; i < MESSAGE_LINES.length; i++) {
          const el = $(`#msgLine${i}`);
          const speed = i === MESSAGE_LINES.length - 1 ? 0.03 : 0.04;
          const charDur = speed;
          const lineDur = MESSAGE_LINES[i].length * charDur;

          gsap.delayedCall(delay, () => {
            el.classList.add('cursor-blink');
            gsap.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 });
            gsap.to(el, {
              text: MESSAGE_LINES[i], duration: lineDur, ease: 'none',
              onComplete: () => el.classList.remove('cursor-blink')
            });
          });
          delay += lineDur + 1.2;
        }

        gsap.delayedCall(delay + 2, () => {
          this.dispose();
          transitionToSection($('#section3'), $('#section4'), () => section4.init());
        });
      }

      _animate() {
        const loop = () => {
          if (!this.initialized || this.disposed) return;
          this.rafId = requestAnimationFrame(loop);
          if (this.starField) this.starField.rotation.y += 0.0003;
          this.renderer.render(this.scene, this.camera);
        };
        loop();
      }

      dispose() {
        this.disposed = true;
        if (this.rafId) cancelAnimationFrame(this.rafId);
        if (this.resizeObs) this.resizeObs.disconnect();
        disposeObject(this.envelope);
        if (this.starField) { this.starField.geometry.dispose(); this.starField.material.dispose(); }
        this.renderer.dispose();
        this.initialized = false;
      }
    }

    /* ─── SECTION 4: SLIDESHOW ─── */
    class Section4 {
      constructor() {
        this.current = 0;
        this.total = PHOTO_FILES.length;
        this.initialized = false;
        this.activeWrap = 'A';
        this.effects = [
          'kenBurnsIn', 'kenBurnsOut', 'parallaxSplit', 'filmBurn',
          'glitchEnter', 'fadeBloom', 'venetian', 'rotateFlip'
        ];
        this.slideTimer = null;
      }

      init() {
        if (this.initialized) return;
        this.initialized = true;
        this._buildDots();
        this._initBokeh();
        this._animateGradient();
        this._bindMusic();
        this._showPhoto(0);
      }

      _buildDots() {
        const row = $('#dotRow');
        row.innerHTML = '';
        for (let i = 0; i < 10; i++) {
          const d = document.createElement('div');
          d.className = 'dot';
          d.dataset.idx = i;
          row.appendChild(d);
        }
      }

      _updateDots() {
        const dots = document.querySelectorAll('#dotRow .dot');
        const start = Math.max(0, Math.min(this.current - 4, this.total - 10));
        dots.forEach((d, i) => {
          const idx = start + i;
          d.classList.toggle('active', idx === this.current);
          d.style.opacity = idx < this.total ? 1 : 0;
        });
        $('#photoCounter').textContent = `Photo ${this.current + 1} of ${this.total}`;
      }

      async _initBokeh() {
        await loadParticles('bokehLayer', {
          fullScreen: { enable: false },
          particles: {
            number: { value: 50 },
            color: { value: ['#FFD700', '#FF69B4', '#C0A0FF', '#FFF5E6'] },
            shape: { type: 'circle' },
            size: { value: { min: 40, max: 120 } },
            move: { enable: true, speed: 0.3, direction: 'none', random: true },
            opacity: { value: { min: 0.06, max: 0.12 } }
          }
        });
      }

      _animateGradient() {
        gsap.to('#gradientBg', {
          backgroundPosition: '100% 100%', duration: 5, repeat: -1, yoyo: true, ease: 'sine.inOut'
        });
        gsap.set('#gradientBg', { backgroundPosition: '0% 0%' });
      }

      _bindMusic() {
        $('#musicToggle').addEventListener('click', () => {
          const playing = audio.toggleMusic();
          $('#waveIcon').classList.toggle('playing', playing);
        });
      }

      _getWrap() {
        return this.activeWrap === 'A'
          ? { wrap: $('#photoWrapA'), img: $('#photoA'), video: $('#videoA') }
          : { wrap: $('#photoWrapB'), img: $('#photoB'), video: $('#videoB') };
      }

      _getOtherWrap() {
        return this.activeWrap === 'A'
          ? { wrap: $('#photoWrapB'), img: $('#photoB'), video: $('#videoB') }
          : { wrap: $('#photoWrapA'), img: $('#photoA'), video: $('#videoA') };
      }

      _stopAllVideos() {
        document.querySelectorAll('.slide-video').forEach((v) => {
          v.pause();
          v.classList.remove('active');
        });
        document.querySelectorAll('#photoWrapA img, #photoWrapB img').forEach((i) => i.classList.remove('hidden'));
      }

      _showPhoto(index) {
        if (index >= this.total) {
          gsap.to(fadeBlack, { opacity: 1, duration: 0.8, onComplete: () => {
            this.dispose();
            transitionToSection($('#section4'), $('#section5'), () => section5.init());
          }});
          return;
        }

        this.current = index;
        this._updateDots();

        const { wrap, img, video } = this._getWrap();
        const file = PHOTO_FILES[index];
        const src = photoSrc(file);
        const isVideo = isVideoFile(file);
        const imageEffects = ['kenBurnsIn', 'kenBurnsOut', 'parallaxSplit', 'filmBurn', 'glitchEnter', 'fadeBloom', 'venetian', 'rotateFlip'];
        const videoEffects = ['kenBurnsIn', 'kenBurnsOut', 'fadeBloom', 'rotateFlip', 'filmBurn'];
        const pool = isVideo ? videoEffects : imageEffects;
        const effect = pool[Math.floor(Math.random() * pool.length)];

        this._stopAllVideos();

        const onReady = (duration) => {
          const slideDuration = duration || 5;
          this._runEffect(effect, wrap, isVideo ? video : img, src, isVideo, () => {
            if (isVideo) video.pause();
            this.activeWrap = this.activeWrap === 'A' ? 'B' : 'A';
            gsap.delayedCall(slideDuration, () => this._showPhoto(index + 1));
          }, slideDuration);
        };

        if (isVideo) {
          img.classList.add('hidden');
          video.classList.add('active');
          video.src = src;
          video.load();
          video.onloadeddata = () => {
            video.play().catch(() => {});
            const dur = Math.min(Math.max(video.duration || 5, 5), 15);
            onReady(dur);
          };
          video.onerror = () => {
            gsap.delayedCall(0.5, () => this._showPhoto(index + 1));
          };
        } else {
          video.classList.remove('active');
          img.classList.remove('hidden');
          img.src = src;
          img.onload = () => onReady(5);
          img.onerror = () => {
            gsap.delayedCall(0.5, () => this._showPhoto(index + 1));
          };
        }
      }

      _runEffect(name, wrap, media, src, isVideo, onComplete, slideDuration = 5) {
        const other = this.activeWrap === 'A' ? $('#photoWrapB') : $('#photoWrapA');
        gsap.set(other, { opacity: 0, zIndex: 0 });
        gsap.set(wrap, { opacity: 1, zIndex: 1, rotationY: 0, transformPerspective: 1200 });
        gsap.set(media, { scale: 1, x: 0, y: 0, clipPath: 'none' });
        gsap.set('#colorWash', { x: '100%', opacity: 1 });
        gsap.set('#filmBurn', { opacity: 0, scale: 0.5 });
        gsap.set(flashOverlay, { opacity: 0 });
        document.querySelectorAll('.venetian-slat').forEach(s => s.remove());

        const tl = gsap.timeline({ onComplete });
        const dur = slideDuration;
        const hold = Math.max(0, dur - 1.5);

        switch (name) {
          case 'kenBurnsIn':
            gsap.set(media, { scale: 1, x: 0 });
            tl.to(media, { scale: 1.08, x: '3%', duration: dur, ease: 'none' });
            break;
          case 'kenBurnsOut':
            gsap.set(media, { scale: 1.1, x: '3%' });
            tl.to(media, { scale: 1, x: '-2%', duration: dur, ease: 'none' });
            break;
          case 'parallaxSplit':
            gsap.set(media, { x: '-100%' });
            tl.to(media, { x: '0%', duration: 1.2, ease: 'power2.out' }, 0)
              .to('#colorWash', { x: '0%', duration: 1, ease: 'power2.inOut' }, 0)
              .to('#colorWash', { opacity: 0, duration: 0.3 }, 1.2)
              .to({}, { duration: hold });
            break;
          case 'filmBurn':
            tl.to({}, { duration: Math.max(0, dur - 1.2) })
              .to('#filmBurn', { opacity: 1, scale: 2.5, duration: 0.8, ease: 'power2.in' })
              .to(wrap, { opacity: 0, duration: 0.3 }, '-=0.2')
              .to({}, { duration: 0.4 });
            break;
          case 'glitchEnter':
            [0, 1, 2].forEach((_, i) => tl.set(media, { x: i % 2 ? 8 : -8 }, i * 0.06));
            tl.set(media, { x: 0 }, 0.25).to({}, { duration: Math.max(0, dur - 0.25) });
            break;
          case 'fadeBloom':
            gsap.set(wrap, { opacity: 0 });
            tl.to(wrap, { opacity: 1, duration: 2, ease: 'power2.inOut' })
              .to(flashOverlay, { opacity: 0.35, duration: 0.25, ease: 'power2.out' }, 0.8)
              .to(flashOverlay, { opacity: 0, duration: 0.5, ease: 'power2.in' }, 1.1)
              .to({}, { duration: Math.max(0, dur - 1.6) });
            break;
          case 'venetian': {
            const stage = $('#photoStage');
            const h = 10;
            gsap.set(wrap, { opacity: 0 });
            for (let s = 0; s < h; s++) {
              const slat = document.createElement('div');
              slat.className = 'venetian-slat';
              slat.style.cssText = `top:${s * 10}%;height:10%;background-image:url(${src})`;
              stage.appendChild(slat);
              tl.to(slat, { rotateX: 0, duration: 0.25, ease: 'power2.out' }, s * 0.06);
            }
            const revealEnd = h * 0.06 + 0.25;
            tl.set(wrap, { opacity: 1 }, revealEnd)
              .call(() => document.querySelectorAll('.venetian-slat').forEach(s => s.remove()))
              .to({}, { duration: Math.max(0, dur - revealEnd) });
            break;
          }
          case 'rotateFlip':
            gsap.set(wrap, { rotationY: 90 });
            tl.to(wrap, { rotationY: 0, duration: 1.2, ease: 'power2.out' })
              .to({}, { duration: Math.max(0, dur - 1.2) });
            break;
          default:
            tl.to({}, { duration: dur });
        }
      }

      dispose() {
        this._stopAllVideos?.();
        destroyParticles('bokehLayer');
        this.initialized = false;
      }
    }

    /* ─── SECTION 5: FINALE ─── */
    class Section5 {
      constructor() {
        this.canvas = $('#canvas5');
        this.scene = null; this.camera = null; this.renderer = null;
        this.particles = []; this.trails = []; this.hearts = [];
        this.titleMesh = null; this.rafId = null; this.resizeObs = null;
        this.initialized = false; this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();
      }

      init() {
        if (this.initialized) return;
        this.initialized = true;
        this.disposed = false;

        const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x08000F);

        this.camera.position.set(0, 0, 8);

        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(w, h, false);

        const pinkLight = new THREE.PointLight(0xFF69B4, 1, 20);
        pinkLight.position.set(0, 2, 3);
        this.scene.add(pinkLight, new THREE.AmbientLight(0x220033, 0.5));

        this._loadTitle();
        this._spawnHearts();
        this._launchFirework(0, -3, 0);
        gsap.delayedCall(0.5, () => this._launchFirework(-2, -3, 0));
        gsap.delayedCall(1, () => this._launchFirework(2, -3, 0));

        this.resizeObs = makeResizeObserver(this.canvas, this.camera, this.renderer, null);
        this._bindEvents();
        gsap.to('#finaleSubtitle', { opacity: 1, duration: 1.5, delay: 1 });

        this._animate();
      }

      _loadTitle() {
        const loader = new FontLoader();
        loader.load('https://cdn.jsdelivr.net/npm/three@0.168.0/examples/fonts/gentilis_regular.typeface.json', (font) => {
          const geo = new TextGeometry('Happy Birthday Divya ❤️', {
            font, size: 0.45, height: 0.1, curveSegments: 6
          });
          geo.center();
          const mat = new THREE.MeshPhongMaterial({
            color: 0xFFD700, emissive: 0xFF69B4, emissiveIntensity: 0.5
          });
          this.titleMesh = new THREE.Mesh(geo, mat);
          this.titleMesh.position.set(0, 1, 0);
          this.scene.add(this.titleMesh);

          gsap.to(mat.emissive, {
            r: 0.5, g: 0, b: 1, duration: 2, repeat: -1, yoyo: true, ease: 'sine.inOut'
          });
          gsap.to(this.titleMesh.scale, {
            x: 1.04, y: 1.04, z: 1.04, duration: 0.8, yoyo: true, repeat: -1, ease: 'sine.inOut'
          });
        });
      }

      _spawnHearts() {
        for (let i = 0; i < 12; i++) {
          const heart = new THREE.Mesh(
            new THREE.TorusKnotGeometry(0.15, 0.04, 64, 8, 2, 3),
            new THREE.MeshPhongMaterial({ color: 0xFF69B4, emissive: 0xB76E79, emissiveIntensity: 0.3 })
          );
          heart.position.set((Math.random() - 0.5) * 6, -4 - Math.random() * 2, (Math.random() - 0.5) * 2);
          this.scene.add(heart);
          this.hearts.push(heart);

          gsap.to(heart.position, {
            y: 4, duration: 6 + Math.random() * 4, repeat: -1, delay: Math.random() * 3,
            ease: 'none', onRepeat: () => { heart.position.y = -4; }
          });
          gsap.to(heart.rotation, { y: Math.PI * 2, duration: 4, repeat: -1, ease: 'none' });
        }
      }

      _launchFirework(x, y, z) {
        const colors = [0xFFD700, 0xFF69B4, 0xC0A0FF, 0xFF4500];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const count = 120;

        for (let i = 0; i < count; i++) {
          const geo = new THREE.SphereGeometry(0.04, 4, 4);
          const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
          const p = new THREE.Mesh(geo, mat);
          p.position.set(x, y, z);

          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const speed = 2 + Math.random() * 4;
          p.userData.vel = new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta) * speed,
            Math.cos(phi) * speed + 2,
            Math.sin(phi) * Math.sin(theta) * speed
          );
          p.userData.life = 1;
          this.scene.add(p);
          this.particles.push(p);

          const trailGeo = new THREE.BufferGeometry();
          const trailPos = new Float32Array(30);
          trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
          const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
            color, transparent: true, opacity: 0.5
          }));
          trail.userData.points = [];
          this.scene.add(trail);
          this.trails.push({ line: trail, particle: p });
        }
      }

      _bindEvents() {
        const onClick = (e) => {
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          this.mouse.x = (cx / window.innerWidth) * 2 - 1;
          this.mouse.y = -(cy / window.innerHeight) * 2 + 1;
          this.raycaster.setFromCamera(this.mouse, this.camera);
          const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -2);
          const target = new THREE.Vector3();
          this.raycaster.ray.intersectPlane(plane, target);
          if (target) this._launchFirework(target.x, target.y, 0);
        };
        this.canvas.addEventListener('click', onClick);
        this.canvas.addEventListener('touchend', (e) => { e.preventDefault(); onClick(e); });

        $('#replayBtn').addEventListener('click', () => {
          audio.unlock();
          section5.dispose();
          section4.dispose();
          section3.dispose();
          section2.dispose();
          ['section4','section5','section3','section2'].forEach(id => $(`#${id}`).classList.remove('active'));
          gsap.set(flashOverlay, { opacity: 0 });
          gsap.set(fadeBlack, { opacity: 0 });
          $('#messageCard').classList.remove('visible');
          $('#messageLines').innerHTML = '';
          $('#blowBtn').classList.remove('hidden');
          $('#cutBtn').classList.add('hidden');
          $('#messageBtn').classList.add('hidden');
          gsap.set('#wishText', { opacity: 0 });
          $('#enterBtn').style.display = '';
          $('#titleOverlay').style.opacity = 1;
          section2.candlesBlown = false;
          section2.cakeCut = false;
          section4.current = 0;
          section4.total = PHOTO_FILES.length;
          section4.activeWrap = 'A';
          section4.initialized = false;
          document.querySelectorAll('.slide-video').forEach(v => { v.pause(); v.removeAttribute('src'); });
          section1.disposed = false;
          section1.initialized = false;
          section1.balloons = [];
          section1.bulbLights = [];
          $('#section1').classList.add('active');
          gsap.fromTo('#section1', { opacity: 0 }, { opacity: 1, duration: 0.8 });
          section1.init();
        });
      }

      _animate() {
        const loop = () => {
          if (!this.initialized || this.disposed) return;
          this.rafId = requestAnimationFrame(loop);

          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.userData.vel.y -= 0.05;
            p.position.add(p.userData.vel.clone().multiplyScalar(0.016));
            p.userData.life -= 0.012;
            p.material.opacity = Math.max(0, p.userData.life);
            if (p.userData.life <= 0) {
              this.scene.remove(p);
              p.geometry.dispose();
              p.material.dispose();
              this.particles.splice(i, 1);
            }
          }

          this.trails.forEach((t, i) => {
            if (!this.particles.includes(t.particle)) {
              this.scene.remove(t.line);
              t.line.geometry.dispose();
              t.line.material.dispose();
              this.trails.splice(i, 1);
              return;
            }
            t.line.userData.points.push(t.particle.position.clone());
            if (t.line.userData.points.length > 10) t.line.userData.points.shift();
            const arr = t.line.geometry.attributes.position.array;
            t.line.userData.points.forEach((pt, j) => {
              arr[j * 3] = pt.x; arr[j * 3 + 1] = pt.y; arr[j * 3 + 2] = pt.z;
            });
            t.line.geometry.attributes.position.needsUpdate = true;
          });

          this.renderer.render(this.scene, this.camera);
        };
        loop();
      }

      dispose() {
        this.disposed = true;
        if (this.rafId) cancelAnimationFrame(this.rafId);
        if (this.resizeObs) this.resizeObs.disconnect();
        this.particles.forEach(p => { p.geometry.dispose(); p.material.dispose(); });
        this.trails.forEach(t => { t.line.geometry.dispose(); t.line.material.dispose(); });
        if (this.titleMesh) disposeObject(this.titleMesh);
        this.hearts.forEach(h => disposeObject(h));
        this.renderer.dispose();
        this.initialized = false;
      }
    }

    /* ─── BOOT ─── */
    const section1 = new Section1();
    const section2 = new Section2();
    const section3 = new Section3();
    const section4 = new Section4();
    const section5 = new Section5();

    section1.init();

    document.addEventListener('click', () => audio.unlock(), { once: true });
    document.addEventListener('touchend', () => audio.unlock(), { once: true });
  </script>
</body>
</html>
